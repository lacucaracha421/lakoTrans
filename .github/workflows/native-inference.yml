name: Native Inference

on:
  push:
    branches: [master, main, codex/dependency-updates-20261004]
    paths:
      - "tools/**"
      - "src/main/runtimeSupport/nativeInference*"
      - "src/main/runtime/native-inference-manifest.json"
      - "src/main/inpainting/**"
      - "tests/nativeInferenceHardware.test.ts"
      - ".github/workflows/native-inference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-native:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - name: Restore native build cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/mgt-koharu-inpaint-runner/target
            tools/mgt-flux-klein-runner/target
            tools/runner-runtime-policy/target
            tools/runner-image-processing/target
          key: native-macos-26-${{ hashFiles('tools/**/Cargo.lock', 'tools/**/Cargo.toml', 'tools/**/build.rs') }}
          restore-keys: native-macos-26-
      - name: Build native Metal-capable workers
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          export LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          export CANDLE_METAL_XCODE=1
          cargo build --release --locked --manifest-path tools/mgt-koharu-inpaint-runner/Cargo.toml --target aarch64-apple-darwin --no-default-features --features metal
          cargo build --release --locked --manifest-path tools/mgt-flux-klein-runner/Cargo.toml --target aarch64-apple-darwin --no-default-features --features metal
      - name: Save compiled native workers
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/mgt-koharu-inpaint-runner/target
            tools/mgt-flux-klein-runner/target
            tools/runner-runtime-policy/target
            tools/runner-image-processing/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Test native and image-processing contracts
        run: npm run test:flux-metal
      - name: Install from remote assets and run real CPU inference
        env:
          MGT_NATIVE_HARDWARE_SMOKE: "1"
          MGT_VITEST_MAX_WORKERS: "1"
          MGT_KOHARU_RUNNER_EXE: ${{ github.workspace }}/tools/mgt-koharu-inpaint-runner/target/aarch64-apple-darwin/release/mgt-koharu-inpaint-runner
          MGT_FLUX_KLEIN_EXE: ${{ github.workspace }}/tools/mgt-flux-klein-runner/target/aarch64-apple-darwin/release/mgt-flux-klein
        run: npx vitest run tests/nativeInferenceHardware.test.ts
      - name: Preserve inference diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-inference-macos-${{ github.run_id }}
          path: |
            .tmp/native-hardware/**/*.log
            .tmp/native-hardware/**/*.png
            .tmp/native-hardware/**/receipt.json
          include-hidden-files: true
          if-no-files-found: warn
