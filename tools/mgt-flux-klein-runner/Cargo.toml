[package]
name = "mgt-flux-klein"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
[features]
default = ["cuda"]
cuda = []
metal = []
inspect-gguf = ["dep:candle-core"]
[dependencies]
anyhow = "1"
candle-core = { version = "0.11", optional = true }
clap = { version = "4.6", features = ["derive"] }
image = "0.25"
koharu-diffusion = { git = "https://github.com/koharu-rs/koharu", rev = "52bb4f55e2266f72c1523562a583c827ec191ceb" }
runner-runtime-policy = { path = "../runner-runtime-policy" }
runner-image-processing = { path = "../runner-image-processing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[bin]]
name = "mgt-flux-klein"
path = "src/main.rs"

[[bin]]
name = "inspect_flux_gguf"
path = "src/bin/inspect_flux_gguf.rs"
required-features = ["inspect-gguf"]
