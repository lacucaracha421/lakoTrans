[package]
name = "mgt-import-source-runner"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hayro = "0.7.1"
memmap2 = "0.9.11"
rars = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
