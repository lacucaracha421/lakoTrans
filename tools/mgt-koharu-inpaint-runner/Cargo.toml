[package]
name = "mgt-koharu-inpaint-runner"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["cuda"]
cuda = ["dep:cudarc", "koharu-ml/cuda"]
metal = ["koharu-ml/metal"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cudarc = { version = "0.19.10", default-features = false, features = ["fallback-dynamic-loading", "runtime", "std"], optional = true }
image = "0.25"
koharu-ml = { path = "vendor/mgt-koharu-models", package = "mgt-koharu-models", default-features = false }
koharu-runtime = { path = "vendor/koharu-runtime-lite" }
libloading = "0.9"
runner-runtime-policy = { path = "../runner-runtime-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }


koharu-torch = { git = "https://github.com/koharu-rs/koharu", rev = "52bb4f55e2266f72c1523562a583c827ec191ceb" }

[patch.crates-io]
candle-kernels = { path = "vendor/candle-kernels-cuda129" }
