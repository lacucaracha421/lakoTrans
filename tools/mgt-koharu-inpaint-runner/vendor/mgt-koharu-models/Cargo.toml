[package]
name = "mgt-koharu-models"
version = "0.83.5"
edition = "2024"
publish = false
license = "GPL-3.0-only"
[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
[dependencies]
anyhow = "1"
image = "0.25"
imageproc = "0.27"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
koharu-torch = { git = "https://github.com/koharu-rs/koharu", rev = "52bb4f55e2266f72c1523562a583c827ec191ceb" }


runner-image-processing = { path = "../../../runner-image-processing" }
